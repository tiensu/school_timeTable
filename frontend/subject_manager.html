<!DOCTYPE html>
<html>
<head>
  <title>Quản lý môn học</title>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial; padding: 20px; }
    table, th, td { border: 1px solid #aaa; border-collapse: collapse; padding: 5px; }
    input { margin: 5px; }
  </style>
</head>
<body>
  <h1>Quản lý môn học</h1>

  <h3>Thêm mới</h3>
  <input type="text" id="subjectName" placeholder="Tên môn học">
  <input type="number" id="subjectGrade" placeholder="Khối">
  <button onclick="addItem()">Thêm</button>

  <h3>Danh sách</h3>
  <table id="itemTable">
    <thead><tr><th>ID</th><th>Tên môn</th><th>Khối</th></tr></thead>
    <tbody></tbody>
  </table>

<script>
  async function fetchItems() {
    const res = await fetch('http://localhost:8000/subjects');
    const data = await res.json();
    const table = document.querySelector("#itemTable tbody");
    table.innerHTML = "";
    data.forEach(r => {
      table.innerHTML += `<tr><td>s.id</td><td>s.name</td><td>s.grade</td></tr>`;
    });
  }

  async function addItem() {
    await fetch('http://localhost:8000/subjects', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({subjectName: document.getElementById("subjectName").value, subjectGrade: document.getElementById("subjectGrade").value})
    });
    fetchItems();
  }

  fetchItems();
</script>
</body>
</html>
