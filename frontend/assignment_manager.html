<!DOCTYPE html>
<html>
<head>
  <title>Quản lý phân công giảng dạy</title>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial; padding: 20px; }
    table, th, td { border: 1px solid #aaa; border-collapse: collapse; padding: 5px; }
    select, button { margin: 5px; }
  </style>
</head>
<body>
  <h1>Phân công giảng dạy</h1>

  <h3>Thêm mới phân công</h3>
  <label>Lớp:</label>
  <select id="classSelect"></select>
  <label>Giáo viên:</label>
  <select id="teacherSelect"></select>
  <label>Môn học:</label>
  <select id="subjectSelect"></select>
  <button onclick="addAssignment()">Phân công</button>

  <h3>Danh sách phân công</h3>
  <table id="assignmentTable">
    <thead><tr><th>ID</th><th>Lớp</th><th>Giáo viên</th><th>Môn học</th></tr></thead>
    <tbody></tbody>
  </table>

<script>
async function fetchOptions(endpoint, selectId, labelKey = "name") {
  const res = await fetch(`http://localhost:8000/${endpoint}`);
  const data = await res.json();
  const select = document.getElementById(selectId);
  data.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item.id;
    opt.text = item[labelKey];
    select.add(opt);
  });
}

async function fetchAssignments() {
  const [classes, teachers, subjects] = await Promise.all([
    fetch("http://localhost:8000/classes").then(r => r.json()),
    fetch("http://localhost:8000/teachers").then(r => r.json()),
    fetch("http://localhost:8000/subjects").then(r => r.json())
  ]);

  const classMap = Object.fromEntries(classes.map(c => [c.id, c.name]));
  const teacherMap = Object.fromEntries(teachers.map(t => [t.id, t.name]));
  const subjectMap = Object.fromEntries(subjects.map(s => [s.id, s.name]));

  const res = await fetch("http://localhost:8000/assignments");
  const data = await res.json();
  const table = document.querySelector("#assignmentTable tbody");
  table.innerHTML = "";
  data.forEach(a => {
    table.innerHTML += `<tr><td>${a.id}</td><td>${classMap[a.class_id]}</td><td>${teacherMap[a.teacher_id]}</td><td>${subjectMap[a.subject_id]}</td></tr>`;
  });
}

async function addAssignment() {
  const class_id = parseInt(document.getElementById("classSelect").value);
  const teacher_id = parseInt(document.getElementById("teacherSelect").value);
  const subject_id = parseInt(document.getElementById("subjectSelect").value);
  await fetch('http://localhost:8000/assignments', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ class_id, teacher_id, subject_id })
  });
  fetchAssignments();
}

fetchOptions("classes", "classSelect");
fetchOptions("teachers", "teacherSelect");
fetchOptions("subjects", "subjectSelect");
fetchAssignments();
</script>
</body>
</html>
