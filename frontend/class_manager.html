<!DOCTYPE html>
<html>
<head>
  <title>Class Manager</title>
  <meta charset="utf-8">
  <!-- Bootstrap 4/5 + Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <style>
    .custom-file-label::after {
      content: "Browse";
      background-color: #007bff;
      color: white;
    }
    .gap-2 > * {
      margin-right: 0.5rem;
    }
    .custom-file-input,
.custom-file-label {
  height: 32px;
  font-size: 0.875rem;
  padding: 6px 10px;
}

  </style>
</head>
<body>


<div class="bg-dark text-white py-3 px-4 d-flex flex-wrap align-items-center justify-content-between" style="border-radius: 4px;">
  <div class="d-flex align-items-center flex-wrap">
    <h5 class="mb-0 mr-4 font-weight-bold"><i class="fas fa-chalkboard mr-2"></i>Manage <span class="text-info">Classes</span></h5>
  </div>

  <div class="d-flex align-items-center flex-wrap">
    <input type="text" class="form-control form-control-sm mr-2" placeholder="Tìm kiếm theo tên lớp..." style="min-width: 200px;">
  </div>

  <div class="d-flex align-items-center flex-wrap mr-2">
    <!-- Nhập tên file (click được) -->
    <div class="input-group input-group-sm" style="width: 240px;">
      <div class="input-group-prepend">
        <span class="input-group-text"><i class="fas fa-file-excel"></i></span>
      </div>
      <input type="text" class="form-control" id="fileName" placeholder="Choose Excel..."
            readonly onclick="document.getElementById('excelFile').click();" style="cursor: pointer;">
    </div>

    <!-- Input file (ẩn) -->
    <input type="file" id="excelFile" style="display: none;" onchange="handleFileSelected(this)">

    <!-- Nút Import -->
    <button class="btn btn-info btn-sm ml-2" onclick="handleImport();">
      <i class="fas fa-upload"></i> Import
    </button>
  </div>

  <div class="d-flex align-items-center flex-wrap">
    <button class="btn btn-danger btn-sm mr-2">
      <i class="fas fa-trash-alt"></i> Delete
    </button>
    <button class="btn btn-success btn-sm">
      <i class="fas fa-plus"></i> Add New Class
    </button>
  </div>
</div>

<script>
  let selectedFile = null;

  function handleFileSelected(input) {
    if (input.files.length > 0) {
      selectedFile = input.files[0];
      document.getElementById("fileName").value = selectedFile.name;
    }
  }

  function handleImport() {
    if (!selectedFile) {
      alert("Vui lòng chọn file trước!");
      return;
    }
    alert("Đang xử lý file: " + selectedFile.name);
  }
</script>


</body>
</html>
