<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Manage Teachers</title>
    <link rel="icon" href="/static/images/teacher-icon.png" type="image/png" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" type="text/css" href="static/multi_select/multi_select.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script type="text/javascript" src="static/multi_select/jquery.multi-select.js"></script>
    <script src="static/js/teacher_management.js"></script>

</head>

<body class="bg-light">
    <div class="container" style="max-width: 1500px;">
        <div class="bg-dark text-white py-3 px-4 d-flex flex-wrap align-items-center justify-content-between"
            style="border-radius: 4px;">
            <!-- Nút Trang chủ -->
            <div class="d-flex align-items-center">
                <button id="btnHome" class="btn btn-primary btn-sm mr-2">
                    <i class="fas fa-home mr-1"></i> Trang chủ
                </button>
            </div>
            <div class="d-flex align-items-center flex-wrap">
                <h5 class="mb-0 mr-4 font-weight-bold"><i class="bi bi-person-badge mr-2"></i>Quản lý <span
                        class="text-info">Giáo viên</span></h5>
            </div>

            <div class="d-flex align-items-center flex-wrap">
                <input type="text" id="searchInput" class="form-control form-control-sm mr-2"
                    placeholder="Tìm kiếm theo tên giáo viên..." style="min-width: 200px;">
            </div>

            <div class="d-flex align-items-center flex-wrap mr-2">
                <!-- Nhập tên file (click được) -->
                <div class="input-group input-group-sm" style="width: 240px;">
                    <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-file-excel"></i></span>
                    </div>
                    <input type="text" class="form-control" id="fileName" placeholder="Chọn file excel..." readonly
                        onclick="document.getElementById('excelFile').click();" style="cursor: pointer;">
                </div>

                <!-- Input file (ẩn) -->
                <input type="file" id="excelFile" style="display: none;" onchange="handleFileSelected(this)">

                <!-- Nút Import -->
                <button class="btn btn-info btn-sm ml-2" onclick="uploadExcel();">
                    <i class="fas fa-upload"></i> Import
                </button>
            </div>

            <div class="d-flex align-items-center flex-wrap">
                <!-- Logout button -->
                <div class="d-flex align-items-center gap-2">
                    <span id="currentUser" class="text-secondary small"></span>
                    <button id="btnLogout" class="btn btn-warning btn-sm">
                        <i class="bi bi-door-closed"></i> Đăng xuất
                    </button>
                </div>
            </div>
        </div>
        <table class="table table-striped table-hover table-bordered">
            <thead>
                <tr class="text-center">
                    <th style="width: 50px;">#</th>
                    <th>Mã GV</th>
                    <th>Họ Tên</th>
                    <th>Chủ Nhiệm Lớp</th>
                    <th>Môn Dạy - Lớp</th>
                    <th>Số Tiết/Tuần</th>
                    <th>Số Tiết Trực X/Tuần</th>
                    <th>Không Dạy</th>
                </tr>
            </thead>
            <tbody id="teacherTableBody">
                <!-- Rows will be inserted by JavaScript -->
            </tbody>
        </table>

        <div class="clearfix">
            <!-- Hàng trên: hint text + selector -->
            <div class="d-flex align-items-center mt-3 mb-2 flex-wrap">
                <select id="pageSizeSelector" class="form-control form-control-sm"
                    style="width: auto; margin-right: 10px;">
                    <option value="5">5 giáo viên/ trang</option>
                    <option value="10">10 giáo viên/ trang</option>
                    <option value="20">20 giáo viên/ trang</option>
                    <option value="50">50 giáo viên/ trang</option>
                </select>
                <div class="hint-text mr-3" id="hintText">Hiển thị 0 trên tổng số 0 giáo viên</div>
            </div>

            <!-- Hàng dưới: pagination -->
            <div>
                <ul class="pagination" id="pagination" style="margin-left: 0;"></ul>
            </div>
        </div>

        <!-- Toast container -->
        <div id="toastContainer" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;"></div>
    </div>
</body>

</html>
