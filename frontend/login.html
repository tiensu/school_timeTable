<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #f7f9fc; }
    .login-card {
      max-width: 420px;
      margin: 8vh auto;
      border: 0;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0,0,0,.08);
    }
    .btn-wide { min-width: 160px; }
  </style>
</head>
<body>
  <div class="card login-card">
    <div class="card-body p-4 p-md-5">
      <h1 class="h4 mb-3 text-center">Đăng nhập hệ thống</h1>
      <p class="text-secondary text-center mb-4">Nhập tài khoản để vào Dashboard</p>

      <div id="alert" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Tên đăng nhập</label>
          <input type="text" class="form-control" id="username" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Mật khẩu</label>
          <input type="password" class="form-control" id="password" required autocomplete="current-password">
        </div>

        <div class="d-grid mt-4">
          <button type="submit" id="btnLogin" class="btn btn-primary btn-wide">
            <span class="spinner-border spinner-border-sm me-2 d-none" id="spinner" aria-hidden="true"></span>
            Đăng nhập
          </button>
        </div>
      </form>

      <p class="text-center text-muted mt-4 mb-0" style="font-size:.9rem">
        Liên hệ quản trị viên nếu bạn quên mật khẩu.
      </p>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000/api/users"; // chỉnh nếu backend mount khác

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alert');
    const btn = document.getElementById('btnLogin');
    const spinner = document.getElementById('spinner');

    function showError(msg) {
      alertBox.textContent = msg || "Đăng nhập thất bại.";
      alertBox.classList.remove('d-none');
    }
    function hideError() {
      alertBox.classList.add('d-none');
      alertBox.textContent = "";
    }
    function setLoading(loading) {
      btn.disabled = loading;
      spinner.classList.toggle('d-none', !loading);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      setLoading(true);

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          showError(err.detail || "Sai tên đăng nhập hoặc mật khẩu.");
          setLoading(false);
          return;
        }

        const data = await res.json();
        // Lưu token & thông tin user
        localStorage.setItem("access_token", data.access_token);
        localStorage.setItem("username", data.username);
        localStorage.setItem("role", data.role);

        // (Tùy chọn) Tải menu theo role để cache
        try {
          const menuRes = await fetch(`${API_BASE}/menu`, {
            headers: { Authorization: `Bearer ${data.access_token}` }
          });
          if (menuRes.ok) {
            const menu = await menuRes.json();
            localStorage.setItem("menu", JSON.stringify(menu));
          }
        } catch {}

        // Điều hướng về dashboard
        window.location.href = "/home.html";
      } catch (err) {
        console.error(err);
        showError("Không thể kết nối máy chủ. Vui lòng thử lại.");
        setLoading(false);
      }
    });
  </script>
</body>
</html>
