<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cấu hình Time Slots</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-gray-50 text-slate-800">
  <div class="max-w-6xl mx-auto p-4 md:p-8">
    <!-- <h1 class="text-2xl font-semibold mb-4">Cấu hình khung thời gian (timetable_slots)</h1> -->
    <div class="bg-dark text-white py-3 px-4 d-flex flex-wrap align-items-center justify-content-between"
            style="border-radius: 4px;">
            <div class="d-flex align-items-center flex-wrap">
                <h5 class="mb-0 mr-4 font-weight-bold"><i class="bi bi-sliders2-vertical mr-2"></i>Quản lý <span
                        class="text-info">Cấu hình</span></h5>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span id="currentUser" class="text-secondary small"></span>
                <button id="btnLogout" class="btn btn-warning btn-sm">
                    <i class="bi bi-door-closed"></i> Đăng xuất
                </button>
            </div>
        </div>
    
    <!-- Cấu hình hiện tại -->
    <div class="bg-white rounded-2xl shadow p-4 mb-6">
      <!-- <h2 class="font-medium mb-3">Cấu hình hiện tại</h2> -->

      <div id="cfg-summary" class="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm mb-4"></div>

      <!-- Bảng cấu hình -->
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm border" id="cfg-table">
          <thead class="bg-slate-100 text-slate-700">
            <tr>
              <th class="px-3 py-2 text-left w-16">#</th>
              <th class="px-3 py-2 text-left">Ngày trong tuần</th>
              <th class="px-3 py-2 text-left">Buổi (Session)</th>
              <th class="px-3 py-2 text-left">Tiết (period)</th>
            </tr>
          </thead>
          <tbody id="cfg-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Điều khiển cấu hình -->
    <div class="bg-white rounded-2xl shadow p-4 mb-6">
      <h2 class="font-medium mb-3">Điều chỉnh cấu hình</h2>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
        <!-- Thêm ngày -->
        <div class="flex items-end gap-2">
          <div>
            <label class="block text-sm mb-1">Thêm ngày</label>
            <select id="cfg-add-day" class="border rounded-lg p-2">
              <option value="">-- chọn --</option>
              <option>Monday</option>
              <option>Tuesday</option>
              <option>Wednesday</option>
              <option>Thursday</option>
              <option>Friday</option>
              <option>Saturday</option>
            </select>
          </div>
          <button id="btn-cfg-add-day" class="px-3 py-2 rounded bg-emerald-600 text-white">Thêm</button>
        </div>

        <!-- Xóa ngày -->
        <div class="flex items-end gap-2">
          <div>
            <label class="block text-sm mb-1">Xóa ngày</label>
            <select id="cfg-del-day" class="border rounded-lg p-2">
              <option value="">-- chọn --</option>
            </select>
          </div>
          <button id="btn-cfg-del-day" class="px-3 py-2 rounded bg-rose-600 text-white">Xóa</button>
        </div>

        <!-- Thêm buổi -->
        <div class="flex items-end gap-2">
          <div>
            <label class="block text-sm mb-1">Thêm buổi</label>
            <select id="cfg-add-session" class="border rounded-lg p-2">
              <option value="">-- chọn --</option>
              <option>morning</option>
              <option>afternoon</option>
              <option>evening</option>
            </select>
          </div>
          <!-- <input id="cfg-add-session-periods" type="number" min="1" max="12" value="5"
            class="border rounded-lg p-2 w-24" /> -->
          <button id="btn-cfg-add-session" class="px-3 py-2 rounded bg-emerald-600 text-white">Thêm</button>
        </div>

        <!-- Xóa buổi -->
        <div class="flex items-end gap-2">
          <div>
            <label class="block text-sm mb-1">Xóa buổi</label>
            <select id="cfg-del-session" class="border rounded-lg p-2">
              <option value="">-- chọn --</option>
            </select>
          </div>
          <button id="btn-cfg-del-session" class="px-3 py-2 rounded bg-rose-600 text-white">Xóa</button>
        </div>
      </div>

      <!-- Điều chỉnh số tiết theo buổi -->
      <div class="mt-4">
        <h3 class="font-medium mb-2">Số tiết / buổi</h3>
        <div id="cfg-period-controls" class="flex flex-wrap gap-3"></div>
      </div>
      <!-- Điều chỉnh số tiết THEO NGÀY & BUỔI -->
      <div class="mt-6">
        <h3 class="font-medium mb-2">Số tiết theo NGÀY & BUỔI</h3>
        <div class="flex flex-wrap items-end gap-3">
          <div>
            <label class="block text-sm mb-1">Ngày</label>
            <select id="day-per-day" class="border rounded-lg p-2">
              <option value="">-- chọn --</option>
              <option>Monday</option>
              <option>Tuesday</option>
              <option>Wednesday</option>
              <option>Thursday</option>
              <option>Friday</option>
              <option>Saturday</option>
            </select>
          </div>
          <div>
            <label class="block text-sm mb-1">Buổi</label>
            <select id="session-per-day" class="border rounded-lg p-2">
              <option value="">-- chọn --</option>
              <option>morning</option>
              <option>afternoon</option>
              <option>evening</option>
            </select>
          </div>
          <div class="flex items-end gap-2">
            <div>
              <label class="block text-sm mb-1">Số tiết</label>
              <div class="flex items-center gap-2">
                <button id="btn-day-minus" class="px-2 py-1 border rounded">−</button>
                <input id="periods-per-day" type="number" min="0" max="12" value="0"
                  class="border rounded p-2 w-24 text-center" />
                <button id="btn-day-plus" class="px-2 py-1 border rounded">+</button>
              </div>
            </div>
            <button id="btn-apply-per-day" class="px-4 py-2 rounded bg-slate-800 text-white">Áp dụng</button>
          </div>
        </div>
      </div>


      <p id="cfg-msg" class="text-sm mt-2"></p>
    </div>
  </div>

  <script src="/static/js/setting_management.js"></script>
</body>

</html>
