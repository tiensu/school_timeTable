<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thời khóa biểu</title>
  <link rel="icon" href="/static/images/timetable-icon.png" type="image/png" />

  <!-- CSS/JS Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="static/css/style.css" />
  <link rel="stylesheet" href="static/css/timetable.css" />

  <!-- JS -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="static/multi_select/jquery.multi-select.js"></script>
  <script src="static/js/timetable_management.js" defer></script>
</head>

<body class="bg-slate-50 text-slate-800">

  <!-- WRAPPER -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-5">

    <!-- HEADER -->
    <div class="bg-dark text-white py-3 px-4 d-flex flex-wrap align-items-center justify-content-between rounded"
      style="border-radius: 6px;">
      <!-- Left: Trang chủ -->
      <div class="d-flex align-items-center mb-2 mb-md-0">
        <button id="btnHome" class="btn btn-primary btn-sm mr-2">
          <i class="fas fa-home mr-1"></i> Trang chủ
        </button>
      </div>

      <!-- Center: Tiêu đề -->
      <div class="text-center mb-2 mb-md-0">
        <h1 class="text-xl sm:text-2xl font-bold mb-0">📚 Thời khóa biểu</h1>
        <p class="text-slate-300 mb-0">Xem và lọc theo lớp, giáo viên. In/PDF hoặc xuất CSV dễ dàng.</p>
      </div>

      <!-- Right: Actions -->
      <div class="btn-group btn-group-toggle mr-2 no-print" data-toggle="buttons">
  <label class="btn btn-outline-light btn-sm active" id="modePrettyLabel" title="Chế độ thẻ màu">
    <input type="radio" name="viewMode" autocomplete="off" checked> Thẻ màu
  </label>
  <label class="btn btn-outline-light btn-sm" id="modeCompactGradeLabel" title="Thu gọn theo khối">
    <input type="radio" name="viewMode" autocomplete="off"> Thu gọn (theo khối)
  </label>
</div>


        <!-- Button cập nhật TKB -->
        <button id="btnUpdateTKB" class="btn btn-success btn-sm mr-2">
          <span class="spinner-border spinner-border-sm d-none" role="status" id="spinnerUpdate"></span>
          <span id="btnUpdateText"><i class="fas fa-sync-alt mr-1"></i> Cập Nhật TKB</span>
        </button>

        <button id="btnPrint" class="btn btn-light btn-sm mr-2">
          <i class="fas fa-print mr-1"></i> In / PDF
        </button>
        <!-- <button id="btnCSV" class="btn btn-outline-light btn-sm mr-2">
          <i class="fas fa-file-csv mr-1"></i> Xuất CSV
        </button> -->
        <button id="btnLogout" class="btn btn-warning btn-sm">
          <i class="bi bi-door-closed mr-1"></i> Đăng xuất
        </button>
      </div>
    </div>

    <!-- FILTERS -->
    <div class="mt-4 grid grid-cols-1 md:grid-cols-4 gap-3 no-print">
      <!-- Lớp -->
      <div>
        <label class="block text-sm text-slate-600 mb-1">Lớp</label>
        <select id="filterClass" class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white">
          <option value="">— Tất cả —</option>
        </select>
      </div>

      <!-- Giáo viên -->
      <div>
        <label class="block text-sm text-slate-600 mb-1">Giáo viên</label>
        <select id="filterTeacher" class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white">
          <option value="">— Tất cả —</option>
        </select>
      </div>

      <!-- Search -->
      <div class="md:col-span-2">
        <label class="block text-sm text-slate-600 mb-1">Tìm kiếm nhanh</label>
        <input id="searchBox" type="text" placeholder="Nhập tên môn, mã môn, giáo viên..."
          class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white" />
      </div>
    </div>

    <!-- LEGEND -->
    <div class="mt-4 no-print" id="legend"></div>

    <!-- GRID -->
    <div id="gridWrapper" class="mt-5 overflow-auto rounded-2xl shadow bg-white">
      <!-- Nội dung grid được render bằng JS -->
    </div>
    <!-- Display error -->
    <div id="tkbError" class="alert alert-danger d-none" role="alert" style="margin-top:50px; border-radius: 10px;">
    </div>

  </div> <!-- /WRAPPER -->

</body>

</html>
